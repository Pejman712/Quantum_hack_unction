[project]
name = "quantum-hack-unction"
version = "0.1.0"
description = "QASM circuit tooling for the quantum hackathon: peak-bitstring estimation and gate stripping."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9.0",
    "mqt-qcec>=3.0.0",
    "pylatexenc>=2.10",
    "qiskit>=1.2",
    "qiskit-aer>=0.13.0",
]

[project.scripts]
quantum-hack = "quantum_hack.cli:main"

[project.optional-dependencies]
# Install with: pip install -e ".[gpu]"
# Requires CUDA 11.x/12.x and NVIDIA drivers.  qiskit-aer-gpu replaces
# qiskit-aer and ships the cuStateVec / GPU-MPS backends.
gpu = [
    "qiskit-aer-gpu>=0.13.0",
    "mpi4py>=3.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantum_hack"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
