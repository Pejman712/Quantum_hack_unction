[project]
name = "quantum-hack-unction"
version = "0.1.0"
description = "QASM circuit tooling for the quantum hackathon: peak-bitstring estimation and gate stripping."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.9",
    "mqt-qcec>=3.6.1",
    "pylatexenc>=2.10",
    "qiskit>=2.4.1",
    "qiskit-aer>=0.17.2",
]

[project.optional-dependencies]
# Tensor-network amplitude/marginal backend for large circuits. GPU Aer on LUMI comes from the
# CSC Qiskit container (qiskit-aer-gpu-rocm), not from PyPI, so it is not listed here.
tn = ["quimb>=1.8", "cotengra>=0.6", "autoray>=0.6", "opt-einsum>=3.3", "torch>=2.0"]

[project.scripts]
quantum-hack = "quantum_hack.cli:main"
quantum-hack-batch = "quantum_hack.batch:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantum_hack"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
