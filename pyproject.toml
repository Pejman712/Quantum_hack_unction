[project]
name = "quantum-hack-unction"
version = "0.1.0"
description = "QASM circuit tooling for the quantum hackathon: peak-bitstring estimation and gate stripping."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.9",
    "mqt-qcec>=3.6.1",
    "pylatexenc>=2.10",
    "qiskit>=2.4.1",
    "qiskit-aer>=0.17.2",
]

[project.optional-dependencies]
# Tensor-network amplitude/marginal backend for large circuits.
# On the DGX cluster (CUDA 13.0 driver): uv sync --extra tn installs torch from the
# pytorch-cuda index below (cu126 wheel; CUDA forward-compatible with the 13.0 driver).
# If a cu130 wheel becomes available, update the index URL accordingly.
tn = ["quimb>=1.8", "cotengra>=0.6", "autoray>=0.6", "opt-einsum>=3.3", "torch>=2.0", "kahypar>=1.3.5"]

[tool.uv.sources]
# Route torch to PyTorch's CUDA 12.6 index on Linux x86_64 (the DGX cluster).
# CUDA 13.0 driver is forward-compatible with cu126 wheels.
# On other platforms (macOS, Windows) uv falls back to the default PyPI CPU wheel.
torch = [
    { index = "pytorch-cuda", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[project.scripts]
quantum-hack = "quantum_hack.cli:main"
quantum-hack-batch = "quantum_hack.batch:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantum_hack"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
