name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Check import sorting (ruff isort)
        run: uv run ruff check --select I .

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Run tests
        # -p no:cacheprovider keeps CI runs clean; fail the build on any failure.
        run: uv run pytest -p no:cacheprovider

  changelog:
    # Block any PR that doesn't touch CHANGELOG.md.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require CHANGELOG.md update
        run: |
          base="origin/${{ github.base_ref }}"
          if git diff --name-only "$base"...HEAD | grep -qx "CHANGELOG.md"; then
            echo "CHANGELOG.md updated."
          else
            echo "::error::CHANGELOG.md must be updated in this PR (add an entry under [Unreleased])."
            exit 1
          fi
